on:
  release:
    types: [published]

name: Publish release

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/okawali/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Create packages
        run: ./build/package.ps1
        shell: pwsh

      - name: Publish nuget packages
        run: |
          dotnet nuget push Shark.Client.Tool/bin/Release/*.nupkg --skip-duplicate
          dotnet nuget push Shark.Server.Tool/bin/Release/*.nupkg --skip-duplicate
          dotnet nuget push Shark.Commons/bin/Release/*.nupkg --skip-duplicate

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "$RELEASE_TAG" ./*.zip
          --clobber
          --repo "$GITHUB_REPOSITORY"
